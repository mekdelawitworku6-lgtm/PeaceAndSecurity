services:
  - type: web
    name: peace-security-dashboard-demo
    runtime: node
    plan: free
    rootDir: apps/peace-and-security-dashboard
    healthCheckPath: /
    buildCommand: npx --yes pnpm@10.14.0 install --frozen-lockfile && npx --yes pnpm@10.14.0 build
    startCommand: ./node_modules/.bin/next start -p $PORT
    envVars:
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      - key: NODE_ENV
        value: production
